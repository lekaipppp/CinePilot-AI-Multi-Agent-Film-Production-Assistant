# Alembic configuration for CinePilot AI
# Run migrations: alembic upgrade head
# Generate a new migration: alembic revision --autogenerate -m "describe change"

[alembic]
# Migrations now live inside the app package for clean project organisation.
script_location = app/database/migrations

# Prepend the project root to sys.path so "from app.config.settings import settings"
# works inside env.py without installing the package.
prepend_sys_path = .

# Separate migration scripts by year/month — keeps the versions/ folder tidy.
# Remove this line if you prefer a flat versions/ directory.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# The DATABASE_URL is read from settings inside env.py — not from this file.
# This dummy value satisfies Alembic's config parser; it is never used.
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
